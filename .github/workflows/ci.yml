name: CI

on: [push, pull_request]

jobs:
  verify-lockfile:
   runs-on: ubuntu-latest
   env:
     GH_TOKEN: ${{ github.token }}
   permissions:
     contents: read
   steps:
     - uses: actions/checkout@v7
       with:
         persist-credentials: false
     - run: gh extension install github/gh-actions-lock --pin v0.4.1
     - run: gh actions-lock --verify
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install rust
      run: rustup show
    - name: Execute checks
      run: make ci
