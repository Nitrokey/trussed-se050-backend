name: Continuous delivery - crates.io

on:
  release:
    types: [published]

jobs:
  publish-trussed-se050-backend:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    environment: crates.io
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - run: cargo publish --package trussed-se050-backend
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  publish-trussed-se050-manage:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.release.tag_name, 'se050-manage-') }}
    environment: crates.io
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - run: cargo publish --package trussed-se050-manage
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
